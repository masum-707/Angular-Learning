<main [style.background-color]="bg">
  <div [class.card]="price > 1000">
    <p>Name: {{ productName }}</p>
    <p>Price: {{ price }}</p>
    <button (click)="changePrice()">increasePrice</button><br /><br />
    <button (click)="changeBg()">Change Bg</button>
    <br /><br />
    <input
      type="text"
      placeholder="Enter userName"
      id="in101"
      (input)="userName = $any($event.target).value"
    />
    <h4>Username:{{ userName }}</h4>
    <input type="email" placeholder="enter email" (input)="getEmail($event)" />
    <h4>Email:{{ email }}</h4>
    <input type="text" placeholder="password" [(ngModel)]="password" />
    <p>Password:{{ password }}</p>
    <label>
      <input type="checkbox" [(ngModel)]="isTrue" />
      checked
    </label>
    <p>display check :{{ isTrue }}</p>
    <label>DropDown</label>
    <select [(ngModel)]="select" for="Select">
      <option value="1">Abc</option>
      <option value="2">Bcd</option>
      <option value="3">Cde</option>
    </select>
    <p>display selected value:{{ select }}</p>

    <!-- #ref template  -->

    <p>Input value using #ref</p>
    <input type="text" #inputRef (input)="(inputRef)" />
    <br />
    <p>value:{{ inputRef.value }}</p>
  </div>
</main>
