<ng-template #LoginPage>
  <h1>Schertech</h1>
  <h2>Login Page</h2>
  <p>Please fill out the following information correctly to Login.</p>
</ng-template>
<ng-template #LoginForm>
  <label for="email">User Email: </label>
  <input type="email" name="email" [(ngModel)]="user.email" required autocomplete="username" />
  <br /><br />
  <label for="password">Password: </label>
  <input
    type="password"
    name="password"
    [(ngModel)]="user.password"
    required
    #ref_password
    autocomplete="current-password"
  />
  <br /><br />
  <button type="submit">Login</button>
</ng-template>

<ng-template #footer>
  <p>
    Don't have an account?<span class="clickable" role="button" (click)="toggleTemplated()"
      >Registration.</span
    >
  </p>
</ng-template>

<div class="registration-container">
  <div class="card">
    <div *ngIf="isRegistrationPage; else LoginPage">
      <h2>Registration Form</h2>
      <p>Please fill out the following information to register.</p>
    </div>
    <form (ngSubmit)="onSubmit()">
      <div *ngIf="isRegistrationPage; else LoginForm">
        <label for="firstName">First name: </label>
        <input type="text" name="firstName" [(ngModel)]="user.firstName" required />
        <br /><br />
        <label for="lastName">Last name: </label>
        <input type="text" name="lastName" [(ngModel)]="user.lastName" required />
        <br /><br />
        <label for="gender">Gender: </label>
        <select name="gender" [(ngModel)]="user.gender" required>
          <option value="" disabled selected>Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option></select
        ><br /><br />
        <label for="dateOfBirth">Date of Birth: </label>
        <input type="date" name="dateOfBirth" [(ngModel)]="user.dateOfBirth" />
        <br /><br />
        <label for="email">User Email: </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required
          autocomplete="username"
        />
        <br /><br />
        <label for="password">Password: </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="user.password"
          required
          #ref_password
          autocomplete="new-password"
        />
        <br /><br />
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>
    <div *ngIf="isRegistrationPage; else footer">
      <p>
        Already have an account?<span class="clickable" role="button" (click)="toggleTemplated()"
          >Login.</span
        >
      </p>
    </div>
  </div>
  <!-- test #ref and pipe in password field
<p>{{ ref_password.value | uppercase }}</p> -->
</div>
